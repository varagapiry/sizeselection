<title>DTF Wizard — Prototype + UX Evaluation (3 Variants)</title>
<style>
/* ==========================================================================
   Jiffy Design System — Tokens
   Colors & typography, semantic roles, spacing, radii, shadows, motion.
   Canonical palette: user's brand notes (#262698 primary, #c90505 urgent).
   Secondary scales (Brand-50…950, etc.) are Figma-derived for UI depth.
   ========================================================================== */

/* --- Font face -------------------------------------------------------------
   Inter is Jiffy's primary family (per Figma DS). Served locally from
   /fonts — variable axes (opsz + wght) both included.
   ---------------------------------------------------------------------------*/
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 100 900;
  font-display: swap;
  src: url('fonts/Inter-VariableFont_opsz_wght.ttf') format('truetype-variations'),
       url('fonts/Inter-VariableFont_opsz_wght.ttf') format('truetype');
  font-variation-settings: 'opsz' auto;
}
@font-face {
  font-family: 'Inter';
  font-style: italic;
  font-weight: 100 900;
  font-display: swap;
  src: url('fonts/Inter-Italic-VariableFont_opsz_wght.ttf') format('truetype-variations'),
       url('fonts/Inter-Italic-VariableFont_opsz_wght.ttf') format('truetype');
  font-variation-settings: 'opsz' auto;
}

:root {
  /* === TYPE FAMILIES ======================================================*/
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
               'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas,
               'Liberation Mono', monospace;

  /* === TYPE SCALE (sizes / line-heights / tracking) =======================
     Scale per Figma DS. Body ≥16px on desktop — do not go below.
     Display tokens have tightened tracking; text tokens do not.
  ==========================================================================*/
  --text-xs-size: 12px;      --text-xs-lh: 18px;     --text-xs-tr: 0;
  --text-sm-size: 14px;      --text-sm-lh: 20px;     --text-sm-tr: 0;
  --text-md-size: 16px;      --text-md-lh: 24px;     --text-md-tr: 0;
  --text-lg-size: 18px;      --text-lg-lh: 28px;     --text-lg-tr: 0;
  --text-xl-size: 20px;      --text-xl-lh: 32px;     --text-xl-tr: 0;

  --display-xs-size: 24px;   --display-xs-lh: 30px;  --display-xs-tr: -0.02em;
  --display-sm-size: 28px;   --display-sm-lh: 36px;  --display-sm-tr: -0.02em;
  --display-md-size: 36px;   --display-md-lh: 44px;  --display-md-tr: -0.02em;
  --display-lg-size: 48px;   --display-lg-lh: 60px;  --display-lg-tr: -0.02em;
  --display-xl-size: 64px;   --display-xl-lh: 78px;  --display-xl-tr: -0.02em;
  --display-2xl-size: 78px;  --display-2xl-lh: 96px; --display-2xl-tr: -0.02em;

  /* Weights */
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;

  /* === BRAND COLORS (canonical, per user brand notes) ====================*/
  --brand-primary: #262698;   /* Deep Jiffy blue — single primary action only */
  --brand-urgent:  #c90505;   /* Checkout red — errors, destructive, urgency */
  --brand-border:  #e1e1e5;   /* Default border on cards, inputs, dividers */

  /* === GRAY SCALE ========================================================*/
  --gray-50:  #F9FAFB;
  --gray-100: #F3F4F6;
  --gray-200: #E5E7EB;
  --gray-300: #D1D5DC;
  --gray-400: #99A1AF;
  --gray-500: #6A7282;
  --gray-600: #4A5565;
  --gray-700: #364153;
  --gray-800: #1E2939;
  --gray-900: #101828;
  --gray-950: #030712;

  /* === BRAND SCALE (derived from #262698 via OKLCH for UI depth) ==========
     #262698 sits around brand-800. These shades give us hover/active/subtle
     backgrounds without inventing new blues. */
  --brand-50:  #F1F1FB;
  --brand-100: #DEDEF5;
  --brand-200: #BEBEEB;
  --brand-300: #9090DC;
  --brand-400: #6060CA;
  --brand-500: #3F3FB5;
  --brand-600: #3030A8;
  --brand-700: #2B2BA0;
  --brand-800: #262698;  /* ← canonical primary */
  --brand-900: #1B1B76;
  --brand-950: #0E0E44;

  /* === URGENT / ERROR SCALE (derived from #c90505) =======================*/
  --urgent-50:  #FDECEC;
  --urgent-100: #FBD3D3;
  --urgent-200: #F6A5A5;
  --urgent-300: #EE6E6E;
  --urgent-400: #E13838;
  --urgent-500: #D31414;
  --urgent-600: #c90505;  /* ← canonical checkout red */
  --urgent-700: #A70404;
  --urgent-800: #830303;
  --urgent-900: #600202;

  /* === SUCCESS SCALE (green for confirmations, delivery-achieved) =========*/
  --success-50:  #F0FDF4;
  --success-100: #DCFCE7;
  --success-200: #BAF7D4;
  --success-300: #7FF0B4;
  --success-500: #00CC73;
  --success-600: #00A65F;
  --success-700: #00834F;

  /* === WARNING (amber — low stock, cutoff countdowns) =====================*/
  --warning-50:  #FEFCE8;
  --warning-100: #FEF9C2;
  --warning-400: #FDC700;
  --warning-500: #F0B100;
  --warning-600: #D08700;
  --warning-700: #A65F00;

  /* === SEMANTIC ROLES — backgrounds =======================================*/
  --bg-surface:          #FFFFFF;
  --bg-surface-hover:    var(--gray-50);
  --bg-surface-active:   var(--gray-100);
  --bg-surface-disabled: var(--gray-100);
  --bg-subtle:           var(--gray-50);   /* page bg for grouped content */
  --bg-brand:            var(--brand-800); /* primary CTA */
  --bg-brand-hover:      var(--brand-900);
  --bg-brand-active:     var(--brand-950);
  --bg-brand-disabled:   var(--brand-300);
  --bg-brand-subtle:     var(--brand-50);  /* badges, info banners */
  --bg-urgent:           var(--urgent-600);
  --bg-urgent-hover:     var(--urgent-700);
  --bg-urgent-subtle:    var(--urgent-50);
  --bg-success:          var(--success-600);
  --bg-success-subtle:   var(--success-50);
  --bg-warning:          var(--warning-500);
  --bg-warning-subtle:   var(--warning-50);
  --bg-inverse:          var(--gray-900);  /* dark trust bar */

  /* === SEMANTIC ROLES — text =============================================*/
  --text-primary:     var(--gray-900);
  --text-secondary:   var(--gray-700);
  --text-tertiary:    var(--gray-500);
  --text-placeholder: var(--gray-400);
  --text-disabled:    var(--gray-300);
  --text-on-brand:    #FFFFFF;
  --text-on-urgent:   #FFFFFF;
  --text-brand:       var(--brand-800);
  --text-urgent:      var(--urgent-600);
  --text-success:     var(--success-700);
  --text-link:        var(--brand-800);
  --text-link-hover:  var(--brand-900);

  /* === SEMANTIC ROLES — borders ==========================================*/
  --border-default:  var(--brand-border); /* #e1e1e5 — canonical gray */
  --border-subtle:   var(--gray-100);
  --border-strong:   var(--gray-300);
  --border-disabled: var(--gray-200);
  --border-brand:    var(--brand-800);
  --border-urgent:   var(--urgent-600);
  --border-success:  var(--success-600);
  --border-focus:    var(--brand-500);

  /* === ICONS =============================================================*/
  --icon-default: var(--gray-500);
  --icon-hover:   var(--gray-700);
  --icon-active:  var(--gray-900);
  --icon-brand:   var(--brand-800);
  --icon-urgent:  var(--urgent-600);
  --icon-success: var(--success-600);
  --icon-disabled:var(--gray-300);

  /* === SPACING (4px base) ================================================*/
  --space-xs:   4px;   /* spacing-1 */
  --space-sm:   8px;   /* spacing-2 */
  --space-3:   12px;
  --space-md:  16px;   /* spacing-4 */
  --space-5:   20px;
  --space-lg:  24px;   /* spacing-6 */
  --space-7:   28px;
  --space-xl:  32px;   /* spacing-8 */
  --space-10:  40px;
  --space-2xl: 48px;   /* spacing-12 */
  --space-14:  56px;
  --space-16:  64px;
  --space-20:  80px;
  --space-24:  96px;

  /* === RADII =============================================================*/
  --radius-xs:   2px;
  --radius-sm:   4px;
  --radius-md:   6px;
  --radius-lg:   8px;
  --radius-xl:  12px;
  --radius-2xl: 16px;
  --radius-3xl: 24px;
  --radius-full: 9999px;

  /* === SHADOWS — used sparingly. Borders are preferred for elevation. ====*/
  --shadow-sm: 0px 1px 2px 0px rgba(16,24,40,0.05);
  --shadow-md: 0px 2px 4px -2px rgba(16,24,40,0.06),
               0px 4px 8px -2px rgba(16,24,40,0.10);
  --shadow-lg: 0px 4px 6px -2px rgba(16,24,40,0.03),
               0px 12px 16px -4px rgba(16,24,40,0.08);
  --shadow-xl: 0px 8px 8px -4px rgba(16,24,40,0.03),
               0px 20px 24px -4px rgba(16,24,40,0.08);
  --shadow-focus: 0 0 0 3px rgba(38,38,152,0.18); /* focus ring from brand */

  /* === MOTION ============================================================*/
  --duration-instant: 100ms;
  --duration-fast:    150ms;
  --duration-normal:  200ms;
  --duration-moderate:300ms;
  --duration-slow:    400ms;
  --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* === BREAKPOINTS (reference) ===========================================*/
  --bp-sm: 375px;
  --bp-md: 768px;
  --bp-lg: 1024px;
  --bp-xl: 1440px;
}

/* ==========================================================================
   SEMANTIC TYPE CLASSES — apply directly to elements.
   ========================================================================== */
.jf-display-2xl { font-family: var(--font-sans); font-weight: var(--fw-bold);
  font-size: var(--display-2xl-size); line-height: var(--display-2xl-lh);
  letter-spacing: var(--display-2xl-tr); color: var(--text-primary); }
.jf-display-xl  { font-family: var(--font-sans); font-weight: var(--fw-bold);
  font-size: var(--display-xl-size); line-height: var(--display-xl-lh);
  letter-spacing: var(--display-xl-tr); color: var(--text-primary); }
.jf-display-lg  { font-family: var(--font-sans); font-weight: var(--fw-bold);
  font-size: var(--display-lg-size); line-height: var(--display-lg-lh);
  letter-spacing: var(--display-lg-tr); color: var(--text-primary); }
.jf-display-md  { font-family: var(--font-sans); font-weight: var(--fw-bold);
  font-size: var(--display-md-size); line-height: var(--display-md-lh);
  letter-spacing: var(--display-md-tr); color: var(--text-primary); }
.jf-display-sm  { font-family: var(--font-sans); font-weight: var(--fw-semibold);
  font-size: var(--display-sm-size); line-height: var(--display-sm-lh);
  letter-spacing: var(--display-sm-tr); color: var(--text-primary); }
.jf-display-xs  { font-family: var(--font-sans); font-weight: var(--fw-semibold);
  font-size: var(--display-xs-size); line-height: var(--display-xs-lh);
  letter-spacing: var(--display-xs-tr); color: var(--text-primary); }

.jf-text-xl { font-family: var(--font-sans); font-size: var(--text-xl-size);
  line-height: var(--text-xl-lh); color: var(--text-primary); }
.jf-text-lg { font-family: var(--font-sans); font-size: var(--text-lg-size);
  line-height: var(--text-lg-lh); color: var(--text-primary); }
.jf-text-md { font-family: var(--font-sans); font-size: var(--text-md-size);
  line-height: var(--text-md-lh); color: var(--text-primary); }
.jf-text-sm { font-family: var(--font-sans); font-size: var(--text-sm-size);
  line-height: var(--text-sm-lh); color: var(--text-secondary); }
.jf-text-xs { font-family: var(--font-sans); font-size: var(--text-xs-size);
  line-height: var(--text-xs-lh); color: var(--text-tertiary); }

/* Shortcut HTML element defaults (only applied when .jf-type scope is set) */
.jf-type h1 { font: var(--fw-bold) var(--display-lg-size)/var(--display-lg-lh) var(--font-sans);
              letter-spacing: var(--display-lg-tr); color: var(--text-primary); margin: 0; }
.jf-type h2 { font: var(--fw-semibold) var(--display-md-size)/var(--display-md-lh) var(--font-sans);
              letter-spacing: var(--display-md-tr); color: var(--text-primary); margin: 0; }
.jf-type h3 { font: var(--fw-semibold) var(--display-sm-size)/var(--display-sm-lh) var(--font-sans);
              letter-spacing: var(--display-sm-tr); color: var(--text-primary); margin: 0; }
.jf-type h4 { font: var(--fw-semibold) var(--display-xs-size)/var(--display-xs-lh) var(--font-sans);
              letter-spacing: var(--display-xs-tr); color: var(--text-primary); margin: 0; }
.jf-type h5 { font: var(--fw-semibold) var(--text-xl-size)/var(--text-xl-lh) var(--font-sans);
              color: var(--text-primary); margin: 0; }
.jf-type p  { font: var(--fw-regular) var(--text-md-size)/var(--text-md-lh) var(--font-sans);
              color: var(--text-primary); margin: 0; }
.jf-type small { font-size: var(--text-sm-size); line-height: var(--text-sm-lh);
                 color: var(--text-secondary); }
.jf-type code  { font-family: var(--font-mono); font-size: 0.95em;
                 background: var(--gray-100); padding: 2px 5px; border-radius: var(--radius-sm); }
.jf-type a     { color: var(--text-link); text-decoration: none; font-weight: var(--fw-medium); }
.jf-type a:hover { color: var(--text-link-hover); text-decoration: underline; }

/* ==========================================================================
   BASE RESET (optional — use on design-system pages) — opt in with .jf-base
   ========================================================================== */
.jf-base, .jf-base *, .jf-base *::before, .jf-base *::after {
  box-sizing: border-box;
}
.jf-base {
  font-family: var(--font-sans);
  font-size: var(--text-md-size);
  line-height: var(--text-md-lh);
  color: var(--text-primary);
  background: var(--bg-surface);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

</style>

function isDarkColor(hex) {
  const c = hex.replace('#', '');
  if (c.length < 6) return false;
  const r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
  // Luma
  return (0.299 * r + 0.587 * g + 0.114 * b) < 140;
}

// helpers
function priceFor(w, h) { return +(Math.max(1, w * h) * 0.022).toFixed(2); }
function qtyOfZone(state, id) {
  if (id === 'custom') return (state.custom?.rows || []).reduce((s, r) => s + (r.qty || 0), 0);
  return Object.values(state[id] || {}).reduce((a, b) => a + (b || 0), 0);
}
function totalOfZone(state, id) {
  if (id === 'custom') return (state.custom?.rows || []).reduce((s, r) => s + (r.qty || 0) * priceFor(r.w, r.h), 0);
  const tbl = SIZE_TABLES[id] || [];
  return tbl.reduce((s, x) => s + ((state[id] && state[id][x.k]) || 0) * x.price, 0);
}
function origOfZone(state, id) {
  if (id === 'custom') return (state.custom?.rows || []).reduce((s, r) => s + (r.qty || 0) * priceFor(r.w, r.h) * 1.667, 0);
  const tbl = SIZE_TABLES[id] || [];
  return tbl.reduce((s, x) => s + ((state[id] && state[id][x.k]) || 0) * x.orig, 0);
}

// ─────────── Custom panel (with max-canvas validation) ───────────
// Soft warning  > 14″ on either axis (above typical zone limits, still printable)
// Hard error    > 22″ on either axis (exceeds press canvas — must split design)
function rowCanvasState(r) {
  const w = r.w || 0, h = r.h || 0;
  if (w > 22 || h > 22) return 'error';
  if (w > 14 || h > 14) return 'warning';
  return 'ok';
}

function CustomPanelInline({ rows, setRows }) {
  const setRow = (i, key, v) => {
    const next = rows.slice();
    next[i] = { ...next[i], [key]: v };
    setRows(next);
  };
  const removeRow = (i) => {
    if (rows.length <= 1) return; // preserve sensible base state
    setRows(rows.filter((_, j) => j !== i));
  };
  const addRow = () => setRows([...rows, { w: 7.38, h: 6.48, qty: 1 }]);
  return (
    <div>
      {rows.map((r, i) => {
        const rs = rowCanvasState(r);
        const rowBorder = rs === 'error' ? `1px solid ${C.red}` : 'none';
        const rowBg = rs === 'error' ? C.red50 : (rs === 'warning' ? C.amber50 : 'transparent');
        return (
          <div key={i} style={{ borderRadius: 8, border: rowBorder, background: rowBg, padding: rs !== 'ok' ? 8 : 0, marginBottom: rs !== 'ok' ? 6 : 0 }}>
            <div style={{ display: 'flex', gap: 10, alignItems: 'flex-end', padding: '10px 0', borderBottom: i < rows.length - 1 && rs === 'ok' ? `1px solid ${C.g100}` : 'none', flexWrap: 'wrap' }}>
              <DimStepper value={r.w} onChange={(v) => setRow(i, 'w', v)} label="Width (in)" />
              <div style={{ alignSelf: 'center', color: C.g400, fontSize: 16, marginTop: 18 }}>×</div>
              <DimStepper value={r.h} onChange={(v) => setRow(i, 'h', v)} label="Height (in)" />
              <div>
                <div style={{ fontSize: 11, color: C.g500, fontWeight: 600, marginBottom: 4, textTransform: 'uppercase', letterSpacing: 0.4 }}>Qty</div>
                <Stepper value={r.qty} onChange={(v) => setRow(i, 'qty', v)} />
              </div>
              <div style={{ marginLeft: 'auto', textAlign: 'right' }}>
                <div style={{ fontSize: 11, color: C.g400, textDecoration: 'line-through' }}>${(priceFor(r.w, r.h) * 1.667).toFixed(2)}</div>
                <div style={{ fontSize: 15, fontWeight: 700 }}>${priceFor(r.w, r.h).toFixed(2)}</div>
              </div>
              <button onClick={() => removeRow(i)} disabled={rows.length <= 1} title={rows.length <= 1 ? 'Keep at least one custom row' : 'Remove'} style={{ background: 'transparent', border: 'none', cursor: rows.length <= 1 ? 'not-allowed' : 'pointer', padding: 6, alignSelf: 'center', opacity: rows.length <= 1 ? 0.4 : 1 }}>{Icon.trash(16)}</button>
            </div>
            {rs === 'warning' && (
              <div role="alert" style={{ fontSize: 12, color: C.g700, padding: '6px 0 0', display: 'flex', alignItems: 'flex-start', gap: 6 }}>
                <span style={{ color: C.amber, fontWeight: 700 }}>⚠</span>
                <span>Bigger than typical placement zones — fits Full Front (up to 12″ × 16″) or Full Back (up to 13″ × 16″).</span>
              </div>
            )}
            {rs === 'error' && (
              <div role="alert" style={{ fontSize: 12, color: C.red, padding: '6px 0 0', display: 'flex', alignItems: 'flex-start', gap: 6, fontWeight: 600 }}>
                <span>⊘</span>
                <span>Width or height can't exceed 22″. Maximum print size is 22″ on either side — try splitting your design into two transfers.</span>
              </div>
            )}
          </div>
        );
      })}
      <button onClick={addRow} style={{ width: '100%', marginTop: 10, padding: '10px', background: C.brand50, border: `1px dashed ${C.brand200}`, borderRadius: 8, color: C.brand, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit', fontSize: 13 }}>+ Add another size</button>
      <div style={{ fontSize: 12, color: C.g500, marginTop: 8 }}>Defaulted to your design's original size (7.38″ × 6.48″) at $0.022/sq in (40% off bulk rate). Max canvas: 22″ × 22″.</div>
    </div>
  );
}

// True if any custom row has a hard canvas error (>22″ on either axis)
function maxCanvasError(state) {
  return (state.custom?.rows || []).some(r => rowCanvasState(r) === 'error');
}

// ─────────── Size grid ───────────
function SizeGrid({ sizes, state, setState, columns = 3 }) {
  return (
    <div style={{ display: 'grid', gridTemplateColumns: `repeat(${columns}, 1fr)`, gap: 10 }}>
      {sizes.map((s) => {
        const qty = state[s.k] || 0;
        const dimmed = qty === 0;
        return (
          <div key={s.k} style={{
            border: `1px solid ${qty > 0 ? C.brand200 : C.border}`,
            background: qty > 0 ? C.brand50 : '#fff',
            borderRadius: 10, padding: 12, opacity: dimmed ? 0.85 : 1, transition: 'all 150ms',
          }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: C.g900 }}>{s.label}</div>
            <div style={{ fontSize: 11, color: C.g500, marginTop: 2, marginBottom: 8 }}>{s.dim}</div>
            <Stepper value={qty} onChange={(v) => setState({ ...state, [s.k]: v })} size="sm" />
            <div style={{ marginTop: 8, display: 'flex', alignItems: 'baseline', gap: 6 }}>
              <span style={{ fontSize: 11, color: C.g400, textDecoration: 'line-through' }}>${s.orig.toFixed(2)}</span>
              <span style={{ fontSize: 13, fontWeight: 700, color: C.g900 }}>${s.price.toFixed(2)}</span>
              <span style={{ fontSize: 10, fontWeight: 700, color: C.green700 }}>40% off</span>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─────────── Savings line under subtotal ───────────
function SavingsLine({ qty, savings, isMobile = false }) {
  if (qty <= 0) {
    return <div style={{ fontSize: isMobile ? 10 : 11, color: C.g500 }}>Add a size to get started</div>;

    <div style={{ fontSize: isMobile ? 10 : 11, color: C.g500, lineHeight: 1.4 }}>

  );
}

// ─────────── State-aware bottom CTA ───────────
function BottomCTA({ qty, hasError, sticky = false, onClick }) {
  let label, disabled, bg;
  if (hasError) { label = 'Fix size error'; disabled = true; bg = C.g300; }
  else if (qty <= 0) { label = 'Add a size'; disabled = true; bg = C.g300; }
  else { label = `Continue → Step 3`; disabled = false; bg = C.brand; }
  const wrapStyle = sticky
    ? { position: 'sticky', bottom: 0, background: '#fff', borderTop: `1px solid ${C.border}`, padding: '12px 0 4px', marginTop: 4, display: 'flex', justifyContent: 'flex-end', gap: 10, alignItems: 'center', zIndex: 5 }
    : { display: 'flex', justifyContent: 'flex-end', gap: 10, alignItems: 'center' };
  return (
    <div style={wrapStyle}>
      <button
        onClick={onClick}
        disabled={disabled}
        style={{
          background: bg, color: '#fff',

(function() {
// Variant D — Ninja Restored, with "Your placements" pill row
//
// Updates from previous version:
//   1. Removed color preview row + cross-sell block (no preview anywhere in D).
//   2. Custom rows now show both Price (per-unit) AND Total (qty × per-unit)
//      so changing Qty reflects in the price column — matches the Popular tab.

//      that tab. Tap × → remove that row.
//
// Custom Size / Popular Size tab toggle is preserved. Popular tab uses the

const _NS = window.BWShared;
const { C: NC, Icon: NI, ScarcityBadge: NScarcity, TrustLine: NTrust,

// ─────────── Smart Sizing presets ───────────
// The five canonical placement zones, with smart-sized default dimensions
// matching A/B/C's preselected sizes. Names match the rest of the prototype.
const POPULAR_PRESETS = [
  { id: 'fullFront',  label: 'Full Front',  w: 11.00, h: 9.67 },
  { id: 'fullBack',   label: 'Full Back',   w: 11.00, h: 9.67 },
  { id: 'leftChest',  label: 'Left Chest',  w:  3.50, h: 3.08 },

];

function priceFor(w, h) { return +(Math.max(1, w * h) * 0.022).toFixed(2); }
function origFor(w, h)  { return +(priceFor(w, h) * 1.667).toFixed(2); }

function rowCanvasState(w, h) {
  const W = w || 0, H = h || 0;
  if (W > 22 || H > 22) return 'error';
  if (W > 14 || H > 14) return 'warning';
  return 'ok';
}

// ─────────── Small UI helpers ───────────
function FieldLabel({ children }) {
  return (
    <div style={{

}

function SmartSizingTag() {
  return (
    <span style={{
      color: NC.green700, fontWeight: 600,
      display: 'inline-flex', alignItems: 'center', gap: 4,

      <span style={{

      Smart Sizing Applied
    </span>
  );
}

// ─────────── Custom row (Price ea + Total qty×price + validation) ───────────
function CustomRow({ row, onChange, onRemove, isMobile, locked }) {
  const setField = (k, v) => onChange({ ...row, [k]: v });
  const ea = priceFor(row.w, row.h);
  const orig = origFor(row.w, row.h);
  const total = row.qty * ea;
  const totalOrig = row.qty * orig;
  const cs = rowCanvasState(row.w, row.h);
  const wrapBorder = cs === 'error' ? `1px solid ${NC.red}` : 'none';
  const wrapBg = cs === 'error' ? NC.red50 : (cs === 'warning' ? NC.amber50 : 'transparent');

  return (
    <div style={{
      borderRadius: 8,
      border: wrapBorder,
      background: wrapBg,
      padding: cs !== 'ok' ? 8 : 0,
      marginBottom: cs !== 'ok' ? 6 : 0,
    }}>
      <div style={{
        display: 'flex',
        gap: 10,
        alignItems: 'flex-end',
        padding: '12px 0',
        borderBottom: cs === 'ok' ? `1px solid ${NC.g100}` : 'none',

        <NDimStepper value={row.w} onChange={(v) => setField('w', v)} label="Width (in)" />

        <NDimStepper value={row.h} onChange={(v) => setField('h', v)} label="Height (in)" />
        <div>
          <FieldLabel>Qty</FieldLabel>

        {/* Price (per-unit ea) */}
        <div style={{ marginLeft: 'auto', textAlign: 'right', minWidth: 70 }}>
          <FieldLabel>Price</FieldLabel>
          <div style={{ fontSize: 11, color: NC.g400, textDecoration: 'line-through', lineHeight: 1.2 }}>${orig.toFixed(2)}</div>
          <div style={{ fontSize: 13, fontWeight: 700, color: NC.g900, lineHeight: 1.2 }}>
            ${ea.toFixed(2)}<span style={{ fontSize: 11, color: NC.g500, fontWeight: 400 }}> ea</span>
          </div>
        </div>

        {/* Total (qty × price) — reflects qty changes */}
        <div style={{ textAlign: 'right', minWidth: 70 }}>
          <FieldLabel>Total</FieldLabel>
          <div style={{ fontSize: 11, color: NC.g400, textDecoration: 'line-through', lineHeight: 1.2 }}>${totalOrig.toFixed(2)}</div>
          <div style={{ fontSize: 13, fontWeight: 700, color: NC.g900, lineHeight: 1.2 }}>${total.toFixed(2)}</div>
          <div style={{ fontSize: 10, fontWeight: 700, color: NC.green700, marginTop: 2 }}>40% off</div>
        </div>

        <button
          onClick={onRemove}
          disabled={locked}
          title={locked ? 'Keep at least one row' : 'Remove'}
          style={{
            background: 'transparent', border: 'none',
            cursor: locked ? 'not-allowed' : 'pointer',
            padding: 6, alignSelf: 'center',
            opacity: locked ? 0.4 : 1,
          }}>
          {NI.trash(16, NC.g500)}
        </button>
      </div>

      {cs === 'warning' && (
        <div role="alert" style={{ fontSize: 12, color: NC.g700, padding: '6px 0 0', display: 'flex', alignItems: 'flex-start', gap: 6 }}>
          <span style={{ color: NC.amber, fontWeight: 700 }}>⚠</span>
          <span>Bigger than typical placement zones — fits Full Front (up to 12″ × 16″) or Full Back (up to 13″ × 16″).</span>
        </div>
      )}
      {cs === 'error' && (
        <div role="alert" style={{ fontSize: 12, color: NC.red, padding: '6px 0 0', display: 'flex', alignItems: 'flex-start', gap: 6, fontWeight: 600 }}>
          <span>⊘</span>
          <span>Width or height can't exceed 22″. Try splitting your design into two transfers.</span>
        </div>
      )}
    </div>
  );
}

// ─────────── Variant D core ───────────
function NinjaWizardCore({ isMobile = false }) {
  const [tab, setTab] = React.useState('custom');
  const [customRows, setCustomRows] = React.useState([{ w: 7.38, h: 6.48, qty: 1 }]);
  const [popularRows, setPopularRows] = React.useState([]);
  // No shirtColor — color preview row removed.

  // Aggregates across both tabs
  const customQty = customRows.reduce((s, r) => s + (r.qty || 0), 0);
  const customTotal = customRows.reduce((s, r) => s + (r.qty || 0) * priceFor(r.w, r.h), 0);
  const popularQty = popularRows.reduce((s, r) => s + (r.qty || 0), 0);
  const popularTotal = popularRows.reduce((s, r) => {
    const p = POPULAR_PRESETS.find(x => x.id === r.presetId);
    return p ? s + (r.qty || 0) * priceFor(p.w, p.h) : s;
  }, 0);
  const grandQty = customQty + popularQty;
  const grandTotal = customTotal + popularTotal;
  const grandOrig = grandTotal * 1.667;
  const left = Math.max(0, 20 - grandQty);

  // Custom row handlers
  const updateCustom = (i, nr) => setCustomRows(customRows.map((r, j) => j === i ? nr : r));
  const removeCustom = (i) => {
    if (customRows.length <= 1) return; // preserve at least one custom row
    setCustomRows(customRows.filter((_, j) => j !== i));
  };
  const addCustom = () => setCustomRows([...customRows, { w: 7.38, h: 6.48, qty: 1 }]);

  // Popular row handlers
  const setPopularQty = (i, v) => setPopularRows(popularRows.map((r, j) => j === i ? { ...r, qty: v } : r));
  const removePopular = (i) => setPopularRows(popularRows.filter((_, j) => j !== i));
  const addPopular = (presetId) => {
    if (popularRows.some(r => r.presetId === presetId)) return;
    setPopularRows([...popularRows, { presetId, qty: 1 }]);
  };

  // Build "Your placements" list — rows with qty > 0 across BOTH tabs.
  // This is what lets the user see + manage selections regardless of which
  // tab is active.
  const placements = [];
  customRows.forEach((r, i) => {
    if ((r.qty || 0) > 0) {
      placements.push({
        key: `c${i}`,
        type: 'custom',
        index: i,
        label: `Custom ${r.w}″ × ${r.h}″`,
        qty: r.qty,
        total: r.qty * priceFor(r.w, r.h),
      });
    }
  });
  popularRows.forEach((r, i) => {
    if ((r.qty || 0) > 0) {
      const p = POPULAR_PRESETS.find(x => x.id === r.presetId);
      if (p) {
        placements.push({
          key: `p${r.presetId}`,
          type: 'popular',
          index: i,
          label: p.label,
          qty: r.qty,
          total: r.qty * priceFor(p.w, p.h),
        });
      }
    }
  });

  // Pill click → switch to that placement's tab so the user can edit.
  const goToPlacement = (pl) => setTab(pl.type);

  // Pill × → remove that specific row entirely.
  // For custom rows we preserve the "min one row" rule by setting qty=0
  // instead of removing when only one custom row exists.
  const clearPlacement = (pl) => {
    if (pl.type === 'custom') {
      if (customRows.length > 1) {
        setCustomRows(customRows.filter((_, j) => j !== pl.index));
      } else {
        setCustomRows(customRows.map((r, j) => j === pl.index ? { ...r, qty: 0 } : r));
      }
    } else {
      setPopularRows(popularRows.filter((_, j) => j !== pl.index));
    }
  };

  const containerStyle = isMobile
    ? { width: 375, background: '#fff', fontFamily: 'Inter, sans-serif', color: NC.g900,
        borderRadius: 12, overflow: 'hidden', border: `1px solid ${NC.border}`, padding: 14 }
    : { width: 706, maxWidth: '100%', background: '#fff', border: `1px solid ${NC.border}`,
        borderRadius: 16, padding: 24, fontFamily: 'Inter, sans-serif', color: NC.g900,
        margin: '0 auto', boxSizing: 'border-box' };

  const availablePresets = POPULAR_PRESETS.filter(p => !popularRows.some(r => r.presetId === p.id));

  return (
    <div style={containerStyle}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: isMobile ? 12 : 16 }}>

        {/* Header */}
        <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 12 }}>
          <div>
            <div style={{
              fontSize: isMobile ? 11 : 12, color: NC.brand, fontWeight: 700,
              letterSpacing: 0.5, textTransform: 'uppercase',
            }}>Step 2 of 3</div>
            <div style={{
              fontSize: isMobile ? 18 : 22, fontWeight: 700,
              letterSpacing: -0.3, marginTop: 2,
            }}>Where should it print?</div>
            <NSubhint isMobile={isMobile}>Pick a custom size or tap a smart-sized preset.</NSubhint>
          </div>
          <div style={{ textAlign: 'right' }} aria-live="polite">
            <div style={{
              fontSize: isMobile ? 10 : 11, color: NC.g500, fontWeight: 600,
              textTransform: 'uppercase', letterSpacing: 0.4,
            }}>Subtotal</div>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 4, justifyContent: 'flex-end', marginTop: 2 }}>
              <span style={{ fontSize: isMobile ? 18 : 24, fontWeight: 700 }}>${grandTotal.toFixed(2)}</span>
              {grandOrig > 0 && (
                <span style={{ fontSize: 11, color: NC.g400, textDecoration: 'line-through' }}>
                  ${grandOrig.toFixed(2)}
                </span>
              )}
            </div>
            <NSavings qty={grandQty} savings={grandOrig - grandTotal} isMobile={isMobile} />
          </div>
        </div>

        {/* Color preview row REMOVED — no preview anywhere in D */}

        {/* Tab toggle: Custom Size / Popular Size */}
        <div style={{ display: 'flex', borderBottom: `1px solid ${NC.border}`, gap: 4 }}>
          <TabBtn label="Custom Size"  sel={tab === 'custom'}  onClick={() => setTab('custom')} />
          <TabBtn label="Popular Size" sel={tab === 'popular'} onClick={() => setTab('popular')} />
        </div>

        {/* Active panel */}
        {tab === 'custom' ? (
          <div>
            <div style={{ fontSize: 12, color: NC.g600, marginBottom: 10, lineHeight: 1.5 }}>
              Need help with sizing? <button onClick={() => setTab('popular')} style={{
                background: 'none', border: 'none', color: NC.brand, textDecoration: 'underline',
                fontWeight: 600, fontFamily: 'inherit', cursor: 'pointer', padding: 0, fontSize: 'inherit',
              }}>Choose a Popular Size →</button>
            </div>

            {customRows.map((r, i) => (
              <CustomRow key={i}
                row={r}
                onChange={(nr) => updateCustom(i, nr)}
                onRemove={() => removeCustom(i)}
                locked={customRows.length <= 1}
                isMobile={isMobile}/>
            ))}

            <button onClick={addCustom} style={{
              background: 'none', border: 'none', color: NC.brand, fontWeight: 700,
              cursor: 'pointer', padding: '10px 0 4px', fontFamily: 'inherit', fontSize: 13,
              textAlign: 'left', alignSelf: 'flex-start',

              + Add another size of this design
            </button>
            <div style={{ fontSize: 12, color: NC.g500, marginTop: 6 }}>
              Defaulted to your design's original size at $0.022/sq in (40% off bulk rate). Free padding for easy cutting. Max canvas: 22″ × 22″.
            </div>
          </div>
        ) : (
          <div>
            <div style={{ fontSize: 12, color: NC.g600, marginBottom: 10, lineHeight: 1.5 }}>

              padding: 12, marginBottom: 14,

            }}>
              <div style={{ fontSize: 12, color: NC.g700, marginBottom: 8, fontWeight: 600 }}>
                {popularRows.length === 0 ? 'Pick a preset' : 'Add another preset'}
              </div>
              {availablePresets.length === 0 ? (
                <div style={{ fontSize: 11, color: NC.g500, fontStyle: 'italic' }}>All presets added.</div>
              ) : (
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                  {availablePresets.map(p => (
                    <button key={p.id} onClick={() => addPopular(p.id)} style={{
                      background: '#fff', border: `1px solid ${NC.brand200}`,
                      borderRadius: 999, padding: '6px 12px',
                      fontSize: 11, fontWeight: 600, color: NC.brand,
                      cursor: 'pointer', fontFamily: 'inherit',
                      display: 'inline-flex', alignItems: 'center', gap: 6,
                      whiteSpace: 'nowrap',
                    }}>
                      <span style={{ fontSize: 13, fontWeight: 700, lineHeight: 1, marginTop: -1 }}>+</span>
                      {p.label}
                      <span style={{ color: NC.g500, fontWeight: 500 }}>· {p.w}″ × {p.h}″</span>
                    </button>
                  ))}
                </div>
              )}
            </div>

            {/* Empty state when no rows selected yet */}
            {popularRows.length === 0 && (
              <div style={{
                fontSize: 12, color: NC.g500, padding: '14px 12px',
                background: NC.g50, border: `1px dashed ${NC.border}`, borderRadius: 8,
                textAlign: 'center',
              }}>
                No presets selected yet. Tap one above to add it — qty &amp; price will show right here.
              </div>
            )}

            {/* Selected preset rows — appear directly below the chip strip */}
            {popularRows.map((r, i) => {
              const preset = POPULAR_PRESETS.find(p => p.id === r.presetId);
              return preset ? (
                <PopularPresetRow key={r.presetId}

                      color: 'inherit', font: 'inherit', cursor: 'pointer',
                    }}>
                      {pl.label} · {pl.qty} · ${pl.total.toFixed(2)}
                    </button>
                    <button onClick={(e) => { e.stopPropagation(); clearPlacement(pl); }}
                      title="Remove placement"
                      style={{
                        width: 20, height: 20, borderRadius: 999, padding: 0,
                        background: isActive ? 'rgba(255,255,255,0.2)' : '#fff',
                        border: isActive ? '1px solid rgba(255,255,255,0.4)' : `1px solid ${NC.brand100}`,
                        color: isActive ? '#fff' : NC.brand,
                        cursor: 'pointer',
                        display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                      }}>{NI.x(11, 'currentColor')}</button>
                  </span>
                );
              })}
            </div>
          </div>
        )}

        {/* Pre-cut config */}
        <NPreCut count={grandQty || 1} />

        {/* USP / trust row — same as A/B/C */}
        <div style={{ background: NC.g50, border: `1px solid ${NC.border}`, borderRadius: 10, padding: 12 }}>
          <NTrust compact={isMobile} />
        </div>
      </div>
    </div>
  );
}

function NinjaWizardDesktop() { return <NinjaWizardCore isMobile={false}/>; }
function NinjaWizardMobile()  { return <NinjaWizardCore isMobile={true}/>; }

window.NinjaWizard = { NinjaWizardDesktop, NinjaWizardMobile };

// ===== INLINED FROM jiffy-clone-wizard.jsx (IIFE-scoped) =====
(function() {
// Variant E — Jiffy Live Faithful Clone
//
// Replicates Jiffy's current production size-picker experience as closely as
// possible. No creativity, no upgrades — exactly what's live today, just
// rendered through the prototype's shared design tokens for clean comparison.
//
// What Jiffy live LACKS (intentionally absent here too):
//   - No subhint
//   - No live overall subtotal block at top with savings $
//   - No state-aware Continue CTA
//   - No max-canvas validation
//   - No USP/trust row inside picker
//   - Title is "Set Design Size" (passive), not "Where should it print?"
//   - Multiple zone sections render simultaneously (no progressive disclosure)
//
// What Jiffy live DOES have (matched here):
//   - Step 2 of 3 eyebrow + "Set Design Size" title with green checkmark
//   - Zone tile horizontal scroll with color-synced shirt thumbnails
//   - "Preview on:" + color swatches + "View Larger Mockups" link
//   - "T-shirt not included. Need one? Browse our selection!" cross-sell
//   - "X of 20 Transfers 50% OFF Left" simple blue scarcity pill
//     (no progress bar, no savings $ amount)
//   - Per-zone sections rendered simultaneously with × remove,
//     horizontal-scrolling size cards, "Y Transfers: $Z.ZZ" subtotal,
//     "Our Sizing Guide" link
//   - Custom Size section with W×H×Qty rows + "+ Add another size"
//     + "Free padding added for easy cutting"
//   - "Want to save time?" pre-cut block
// Audit-framework score: 7.3, identical to Jiffy live's picker-only score.

const _JS = window.BWShared;
const { C: JC, Icon: JI, Stepper: JStepper, DimStepper: JDimStepper,
  ColorRow: JColorRow, ZoneIcon: JZoneIcon,
  PreCutBlock: JPreCut,
  ZONE_DEFS: JZONES, SIZE_TABLES: JSIZES,
  qtyOfZone: jQty } = _JS;

function priceForCustom(w, h) { return +(Math.max(1, w * h) * 0.022).toFixed(2); }

// ─────────── Zone tile in horizontal scroll ───────────
function ZoneTile({ zone, sel, shirtColor, onClick }) {
  return (
    <button onClick={onClick} style={{
      flex: '0 0 auto',
      width: 110,
      padding: '10px 8px',
      background: sel ? JC.brand50 : '#fff',
      border: sel ? `2px solid ${JC.brand}` : `1px solid ${JC.border}`,
      borderRadius: 12,
      cursor: 'pointer',
      fontFamily: 'inherit',
      textAlign: 'center',
      position: 'relative',
      transition: 'all 120ms',
    }}>
      <div style={{ display: 'flex', justifyContent: 'center' }}>
        <JZoneIcon id={zone.id} shirtColor={shirtColor} active={sel}/>
      </div>
      <div style={{ fontSize: 12, fontWeight: 600, color: JC.g900, marginTop: 4, lineHeight: 1.2 }}>{zone.label}</div>
      {sel && (
        <div style={{
          position: 'absolute', top: 4, right: 4,
          width: 18, height: 18, borderRadius: 999,
          background: JC.brand, color: '#fff',
          display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
        }}>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
      )}
    </button>
  );
}

// ─────────── Size card (within a zone section, horizontal scroll) ───────────
function SizeCard({ size, qty, onChange }) {
  const total = (qty * size.price).toFixed(2);
  return (
    <div style={{
      flex: '0 0 auto',
      minWidth: 130,
      padding: 12,
      border: `1px solid ${JC.border}`,
      borderRadius: 10,
      background: '#fff',
    }}>
      <div style={{ fontSize: 12, fontWeight: 700, color: JC.g900, lineHeight: 1.2 }}>{size.label}</div>
      <div style={{ fontSize: 11, color: JC.g500, marginTop: 2, marginBottom: 8 }}>{size.dim}</div>
      <JStepper value={qty} onChange={onChange} size="sm" />
      <div style={{
        marginTop: 8,
        fontSize: 13, fontWeight: 700,
        color: qty > 0 ? JC.g900 : 'transparent',
        minHeight: 18,
      }}>${total}</div>
    </div>
  );
}

// ─────────── Per-zone section ───────────
function ZoneSection({ zone, state, setState, onRemove, isMobile }) {
  const sizes = JSIZES[zone.id] || [];
  const qty = Object.values(state).reduce((a, b) => a + (b || 0), 0);
  const total = sizes.reduce((s, sz) => s + (state[sz.k] || 0) * sz.price, 0);

  return (
    <div style={{
      border: `1px solid ${JC.border}`,
      borderRadius: 12,
      padding: 14,
      background: '#fff',
      marginBottom: 12,
    }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
        <span style={{
          fontSize: 11, fontWeight: 700, color: JC.brand,
          background: JC.brand50,
          padding: '4px 10px', borderRadius: 6,
          letterSpacing: 0.4, textTransform: 'uppercase',
        }}>{zone.label}</span>
        <button onClick={onRemove} style={{
          background: 'transparent', border: 'none', cursor: 'pointer', padding: 4,
        }}>{JI.x(14, JC.g500)}</button>
      </div>
      <div style={{
        display: 'flex',
        gap: 10,
        overflowX: 'auto',
        WebkitOverflowScrolling: 'touch',
        margin: '0 -14px',
        padding: '4px 14px',
        scrollbarWidth: 'thin',
      }}>
        {sizes.map(sz => (
          <SizeCard key={sz.k}
            size={sz}
            qty={state[sz.k] || 0}
            onChange={(v) => setState({ ...state, [sz.k]: v })}/>
        ))}
      </div>
      <div style={{
        display: 'flex',
        justifyContent: 'space-between',
        alignItems: 'center',
        marginTop: 12,
        paddingTop: 12,
        borderTop: `1px solid ${JC.g100}`,
      }}>
        <div style={{ fontSize: 13, color: JC.g700 }}>
          <strong style={{ color: JC.g900 }}>{qty} Transfers:</strong>{' '}
          <span style={{ fontWeight: 700, color: qty > 0 ? JC.g900 : JC.g400 }}>${total.toFixed(2)}</span>
        </div>
        <a style={{
          fontSize: 12, color: JC.brand,
          textDecoration: 'underline',
          fontWeight: 500, cursor: 'pointer',
        }}>Our Sizing Guide</a>
      </div>
    </div>
  );
}

// ─────────── Custom Size section ───────────
function CustomSection({ rows, setRows, onRemove }) {
  const setRow = (i, key, v) => {
    const next = rows.slice();
    next[i] = { ...next[i], [key]: v };
    setRows(next);
  };
  const removeRow = (i) => {
    if (rows.length <= 1) return;
    setRows(rows.filter((_, j) => j !== i));
  };
  const addRow = () => setRows([...rows, { w: 7.38, h: 6.48, qty: 1 }]);

  const totalQty = rows.reduce((s, r) => s + (r.qty || 0), 0);
  const totalPrice = rows.reduce((s, r) => s + (r.qty || 0) * priceForCustom(r.w, r.h), 0);

  return (
    <div style={{
      border: `1px solid ${JC.border}`,
      borderRadius: 12,
      padding: 14,
      background: '#fff',
      marginBottom: 12,
    }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
        <span style={{
          fontSize: 11, fontWeight: 700, color: JC.brand,
          background: JC.brand50,
          padding: '4px 10px', borderRadius: 6,
          letterSpacing: 0.4, textTransform: 'uppercase',
        }}>Custom Size</span>
        <button onClick={onRemove} style={{
          background: 'transparent', border: 'none', cursor: 'pointer', padding: 4,
        }}>{JI.x(14, JC.g500)}</button>
      </div>

      {rows.map((r, i) => (
        <div key={i} style={{
          display: 'flex',
          gap: 10,
          alignItems: 'flex-end',
          padding: '10px 0',
          borderBottom: i < rows.length - 1 ? `1px solid ${JC.g100}` : 'none',
          flexWrap: 'wrap',
        }}>
          <JDimStepper value={r.w} onChange={(v) => setRow(i, 'w', v)} label="Width" />
          <div style={{ alignSelf: 'center', color: JC.g400, fontSize: 16, marginTop: 18 }}>×</div>
          <JDimStepper value={r.h} onChange={(v) => setRow(i, 'h', v)} label="Height" />
          <div>
            <div style={{ fontSize: 11, color: JC.g500, fontWeight: 600, marginBottom: 4, textTransform: 'uppercase', letterSpacing: 0.4 }}>Qty</div>
            <JStepper value={r.qty} onChange={(v) => setRow(i, 'qty', v)} />
          </div>
          <div style={{ marginLeft: 'auto', textAlign: 'right' }}>
            <div style={{ fontSize: 11, color: JC.g500, fontWeight: 600, marginBottom: 4, textTransform: 'uppercase', letterSpacing: 0.4 }}>Total</div>
            <div style={{
              fontSize: 14, fontWeight: 700,
              color: r.qty > 0 ? JC.g900 : JC.g400,
              height: 36,
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'flex-end',
            }}>
              ${(r.qty * priceForCustom(r.w, r.h)).toFixed(2)}
            </div>
          </div>
          {rows.length > 1 && (
            <button onClick={() => removeRow(i)} title="Remove" style={{
              background: 'transparent', border: 'none',
              cursor: 'pointer',
              padding: 0,
              height: 36, width: 36,
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
            }}>{JI.trash(16)}</button>
          )}
        </div>
      ))}

      <button onClick={addRow} style={{
        marginTop: 8,
        background: 'transparent', border: 'none',
        color: JC.brand, fontWeight: 600, fontSize: 13,
        cursor: 'pointer', fontFamily: 'inherit',
        padding: '6px 0', textAlign: 'left',
      }}>+ Add another size</button>

      <div style={{
        display: 'flex',
        justifyContent: 'space-between',
        alignItems: 'center',
        marginTop: 12,
        paddingTop: 12,
        borderTop: `1px solid ${JC.g100}`,
        flexWrap: 'wrap',
        gap: 8,
      }}>
        <div style={{ fontSize: 13, color: JC.g700 }}>
          <strong style={{ color: JC.g900 }}>{totalQty} Transfers:</strong>{' '}
          <span style={{ fontWeight: 700, color: totalQty > 0 ? JC.g900 : JC.g400 }}>${totalPrice.toFixed(2)}</span>
        </div>
        <div style={{ fontSize: 12, color: JC.g500, fontStyle: 'italic' }}>
          Free padding added for easy cutting
        </div>
      </div>
    </div>
  );
}

// ─────────── Variant E core ───────────
function JiffyCloneCore({ isMobile = false }) {
  // Only Custom is selected on first load — matches Jiffy live's default state.
  // Other zones become visible only when the user taps their zone tile.
  const [selectedZones, setSelectedZones] = React.useState(['custom']);
  const [state, setState] = React.useState({
    custom: { rows: [{ w: 7.38, h: 6.48, qty: 1 }] },
  });
  const [shirtColor, setShirtColor] = React.useState('#FFFFFF');

  const grandQty = JZONES.reduce((s, t) => s + jQty(state, t.id), 0);
  const left = Math.max(0, 20 - grandQty);

  const toggleZone = (id) => {
    if (selectedZones.includes(id)) {
      setSelectedZones(selectedZones.filter(z => z !== id));
    } else {
      setSelectedZones([...selectedZones, id]);
    }
  };
  const removeZone = (id) => setSelectedZones(selectedZones.filter(z => z !== id));

  const containerStyle = isMobile
    ? { width: 375, background: '#fff', fontFamily: 'Inter, sans-serif', color: JC.g900, borderRadius: 12, overflow: 'hidden', border: `1px solid ${JC.border}`, padding: 14 }
    : { width: 706, maxWidth: '100%', background: '#fff', border: `1px solid ${JC.border}`, borderRadius: 16, padding: 24, fontFamily: 'Inter, sans-serif', color: JC.g900, margin: '0 auto', boxSizing: 'border-box' };

  return (
    <div style={containerStyle}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: isMobile ? 12 : 16 }}>

        {/* Header — eyebrow + title + green checkmark (no subhint, no overall subtotal block) */}
        <div>
          <div style={{
            fontSize: isMobile ? 11 : 12,
            color: JC.brand, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase',
          }}>Step 2 of 3</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 2 }}>
            <span style={{ fontSize: isMobile ? 18 : 22, fontWeight: 700, letterSpacing: -0.3 }}>Set Design Size</span>
            {grandQty > 0 && (
              <span style={{
                width: 22, height: 22, borderRadius: 999,
                background: JC.green, color: '#fff',
                display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
              }}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </span>
            )}
          </div>
        </div>

        {/* Zone tile horizontal scroll */}
        <div style={{
          display: 'flex',
          gap: 10,
          overflowX: 'auto',
          WebkitOverflowScrolling: 'touch',
          margin: isMobile ? '0 -14px' : '0 -8px',
          padding: isMobile ? '4px 14px 8px' : '4px 8px 8px',
          scrollbarWidth: 'thin',
        }}>
          {JZONES.map(z => (
            <ZoneTile key={z.id} zone={z}
              sel={selectedZones.includes(z.id)}
              shirtColor={shirtColor}
              onClick={() => toggleZone(z.id)}/>
          ))}
        </div>

        {/* Color preview row + cross-sell */}
        <div style={{ background: JC.g50, border: `1px solid ${JC.border}`, borderRadius: 10, padding: '12px 14px' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 6, flexWrap: 'wrap', gap: 4 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: JC.g900 }}>Preview on:</div>
            <a style={{ fontSize: 12, color: JC.brand, textDecoration: 'underline', fontWeight: 500, cursor: 'pointer' }}>View Larger Mockups</a>
          </div>
          <div style={{ fontSize: 12, color: JC.g500, marginBottom: 8, fontStyle: 'italic' }}>
            Transfers are printed in full color; pick a shirt color to preview how it'll look.
          </div>
          <div style={{ overflowX: 'auto', WebkitOverflowScrolling: 'touch' }}>
            <JColorRow value={shirtColor} onChange={setShirtColor} compact={isMobile} />
          </div>
          <div style={{ fontSize: 12, color: JC.g600, marginTop: 8, fontStyle: 'italic' }}>
            T-shirt not included. Need one? <a style={{ color: JC.brand, fontWeight: 600, textDecoration: 'underline', cursor: 'pointer', fontStyle: 'normal' }}>Browse our selection!</a>
          </div>
        </div>

        {/* Simple "X of 20 Transfers 50% OFF Left" pill (Jiffy style — no progress bar, no savings $) */}
        <div style={{
          alignSelf: 'flex-start',
          background: JC.brand50, color: JC.brand,
          padding: '6px 12px', borderRadius: 8,
          fontSize: 13, fontWeight: 700,
          border: `1px solid ${JC.brand100}`,
        }}>
          {left} of 20 Transfers 50% OFF Left
        </div>

        {/* Sections for selected zones — render simultaneously */}
        {selectedZones.map(zoneId => {
          if (zoneId === 'custom') {
            return <CustomSection key="custom"
              rows={state.custom?.rows || []}
              setRows={(rows) => setState({ ...state, custom: { rows } })}
              onRemove={() => removeZone('custom')}/>;
          }
          const zone = JZONES.find(z => z.id === zoneId);
          if (!zone) return null;
          return <ZoneSection key={zoneId}
            zone={zone}
            state={state[zoneId] || {}}
            setState={(next) => setState({ ...state, [zoneId]: next })}
            onRemove={() => removeZone(zoneId)}
            isMobile={isMobile}/>;
        })}

        {/* Pre-cut config */}
        <JPreCut count={grandQty || 1} />
      </div>
    </div>
  );
}

function JiffyCloneWizardDesktop() { return <JiffyCloneCore isMobile={false}/>; }
function JiffyCloneWizardMobile()  { return <JiffyCloneCore isMobile={true}/>; }

window.JiffyCloneWizard = { JiffyCloneWizardDesktop, JiffyCloneWizardMobile };

})();

</script>
